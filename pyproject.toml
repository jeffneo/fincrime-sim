[project]
name = "fincrime"
version = "0.1.0"
description = "Synthetic financial crime simulator - labeled AML/fraud datasets over a Neo4j property graph"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "polars>=1.17",
    "pyarrow>=18.1",
    "typer>=0.15",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "neo4j>=5.27",
    "rich>=13.9",
]

[project.optional-dependencies]
# Pulled in only by `fincrime validate` (M5). Kept out of the default install so
# dataset generation stays a light dependency set.
validate = [
    "lightgbm>=4.5",
    "scikit-learn>=1.6",
    "scipy>=1.14",
]

[project.scripts]
fincrime = "fincrime.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fincrime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
